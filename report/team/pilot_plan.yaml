# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02) — số từ src/lab13.py
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48; n = 3.103 mỗi nhóm → 42 người mỗi nhóm, tổng 84 > 40 nhân viên: không đủ người
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa 20 / 0,02 = 1.000 < 1.251: không đạt mức chênh 5 điểm
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa 6 / 0,02 = 300 (và chỉ 6 cụm, dưới 20)
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m ≥ 859 × (0,98 + 0,02m) → m ≥ 299 yêu cầu mỗi người (DE 6,96)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   (Cách chia: theo nhân viên, 20 nhân viên dùng trợ lý + 20 nhân viên đối chứng)
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm cùng tuần, cùng các depot với nhóm dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên, bốc thăm bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên chia sẻ câu trả lời trong depot; cấp quyền trợ lý theo tài khoản, log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chốt trong file này trước ngày bắt đầu pilot, không sửa khi đang chạy.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 cụm (nhân viên) mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chia theo nhân viên 20 + 20 tách được tác động nhưng chỉ đủ mẫu cho mức chênh 6 điểm, không phải 5 điểm.
#   Nếu tác động thật chỉ 5 điểm, power còn 0,64 (statsmodels NormalIndPower, n = 859). Giám đốc vận hành ký chấp nhận trước ngày bắt đầu.
#   Mỗi nhân viên nhóm trợ lý cần ≥ 299 yêu cầu trong phạm vi: khoảng 30 yêu cầu/người/ngày (1.500 × 82% / 40) → khoảng 10 ngày làm việc ở bước 0.50.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn: hiện tại 4,25% (51/1.200); trong phạm vi noi_dia + hang_nang 3,97% (39/982).
#   Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu, nên dùng: chênh với đối chứng ≥ 2 điểm, kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang ở cả 12 depot (0,22× và 0,69× so với 12.000 đ, simulated); loại quoc_te (1,88×, thành công 27,3%) và doi_tac (0,85×, điều khoản riêng)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần: 4 → 10 → 20 nhân viên; chỉ đo chỉ số chính từ bước 0.50, kéo dài 2 tuần
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận: 20 + 20 nhân viên không đủ mẫu cho 0,05 (power 0,64 ở 5 điểm)
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96           # m = 299 yêu cầu mỗi nhân viên, ICC 0,02
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng tuần, cùng depot với 20 nhân viên dùng trợ lý"
    spillover_risk: "Trung bình: nhân viên cùng depot có thể chia sẻ câu trả lời; giảm bằng cấp quyền trợ lý theo tài khoản và log lượt mở trợ lý theo staff_id"
    predeclared: "Có: chỉ số chính, mde 0,06, luật dừng và ngày quyết định chốt trong file này trước ngày bắt đầu 2026-12-07; bốc thăm bằng code, seed ghi trước, phân tầng theo depot"
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng từ 2 điểm trở lên, hoặc vượt 6%, hoặc có từ 1 ca hoàn tiền trùng trở lên TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và Kỹ sư trưởng agent rà trace các ca đó trong 2 ngày KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công (phút xem lại và làm lại đo thật) vượt 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về noi_dia và đặt giới hạn 2 lần chạy KHÔNG THÌ không được mở lại hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo) vượt 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên nhóm trợ lý trong 3 ngày và báo cáo cho Giám đốc vận hành KHÔNG THÌ không được chuyển bước rollout"
    - "NẾU tỉ lệ làm lại theo tuần vượt 7% (đợt chạy thử 4,9%) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí rà 20 trace làm lại gần nhất và sửa nguyên nhân gốc KHÔNG THÌ không được giảm tỉ lệ xem lại"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt trợ lý, hiệu lực trong 30 phút; mọi yêu cầu mới chuyển về luồng nhân viên tự làm (6 phút, 12.000 đ/yêu cầu); yêu cầu đang xử lý được chuyển cho nhân viên kèm tóm tắt"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "phut_xem_lai_simulated: 890 phút, 1.780.000 đ"
    - "phut_lam_lai_simulated: 1.132 phút, 2.264.000 đ"
    - "Chi phí mỗi việc thành công 4.472 đ (3.414 đ trong phạm vi; 4.599 đ khi cộng cố định)"
    - "Chi phí theo loại: noi_dia 2.696 đ, hang_nang 8.221 đ, quoc_te 22.515 đ, doi_tac 10.215 đ"
    - "Bảng độ nhạy B1-B3 và B4 (11.743 đ = 0,98×; 12.415 đ = 1,03× với 15,3 phút làm lại)"
    - "Ngưỡng chi phí 8.000 đ trong luật dừng dựa trên các số simulated ở trên"
